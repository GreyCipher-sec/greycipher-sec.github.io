<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500"
     font-family="monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg    { fill: #0e1113; }
    .card  { fill: #14181b; stroke: #2c3236; stroke-width: 1.5; }
    .hdr   { fill: #eef0f1; font-size: 13px; font-weight: 700; }
    .sub   { fill: #7f878c; font-size: 10px; }
    .item  { fill: #b9c0c5; font-size: 10.5px; }
    .accent{ fill: #8fd694; font-size: 10.5px; }
    .lane  { fill: #6c757a; font-size: 10.5px; font-weight: 700; letter-spacing: 2px; }
    .edge  { stroke: #46525a; stroke-width: 1.5; fill: none; }
    .elabel{ fill: #7f878c; font-size: 9.5px; }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="500"/>

  <text class="lane" x="30" y="30">SERVER SIDE</text>
  <text class="lane" x="546" y="30">CLIENT SIDE</text>

  <!-- ================= CRAWLER ================= -->
  <rect class="card" x="30" y="48" width="380" height="168" rx="6"/>
  <text class="hdr"  x="48" y="74">Crawler</text>
  <text class="sub"  x="48" y="91">PowerShell · Scheduled Task</text>
  <text class="item" x="48" y="120">— scans classified folders on a schedule</text>
  <text class="item" x="48" y="142">— tags filenames: [RESTRICTED] …</text>
  <text class="item" x="48" y="164">— writes classification into the file:</text>
  <text class="item" x="64" y="184">Office / PDF / EXIF metadata,</text>
  <text class="item" x="64" y="204">NTFS alternate data streams</text>

  <!-- ================= AGENT SERVICE ================= -->
  <rect class="card" x="546" y="48" width="424" height="124" rx="6"/>
  <text class="hdr"  x="564" y="74">Agent Service</text>
  <text class="sub"  x="564" y="91">Windows Service · C# · runs as SYSTEM</text>
  <text class="item" x="564" y="120">— central classification logic</text>
  <text class="item" x="564" y="142">— most-restrictive-signal-wins rule</text>
  <text class="item" x="564" y="164">— exposed over a local named pipe</text>

  <!-- ================= THREE CLIENTS ================= -->
  <rect class="card" x="546" y="200" width="424" height="70" rx="6"/>
  <text class="hdr"  x="564" y="224">Session Monitor</text>
  <text class="sub"  x="564" y="241">user session process</text>
  <text class="item" x="564" y="261">hooks the Windows Open / Save dialog</text>

  <rect class="card" x="546" y="286" width="424" height="70" rx="6"/>
  <text class="hdr"  x="564" y="310">Browser extension</text>
  <text class="sub"  x="564" y="327">+ native messaging host</text>
  <text class="item" x="564" y="347">covers drag &amp; drop and paste</text>

  <rect class="card" x="546" y="372" width="424" height="70" rx="6"/>
  <text class="hdr"  x="564" y="396">Outlook add-in</text>
  <text class="sub"  x="564" y="413">VSTO</text>
  <text class="item" x="564" y="433">last check on the ItemSend event</text>

  <!-- named pipe bus -->
  <path class="edge" d="M 546 235 H 520"/>
  <path class="edge" d="M 546 321 H 520"/>
  <path class="edge" d="M 546 407 H 520"/>
  <path class="edge" d="M 520 407 V 138 H 546"/>
  <circle cx="546" cy="138" r="3.5" fill="#5a8f63"/>
  <text class="elabel" x="508" y="300" transform="rotate(-90 508 300)">named pipe</text>

  <!-- ================= SHARED STORE ================= -->
  <rect class="card" x="30" y="372" width="380" height="94" rx="6"/>
  <text class="hdr"  x="48" y="398">Existing network share</text>
  <text class="item" x="48" y="424">— policy.json — path → label rules</text>
  <text class="item" x="48" y="446">— central logs · restricted NTFS ACL</text>

  <!-- crawler -> share -->
  <path class="edge" d="M 130 216 V 372" marker-end="url(#arrow)"/>
  <!-- agent service -> share -->
  <path class="edge" d="M 600 172 V 188 H 462 V 340 H 280 V 372" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#46525a"/>
    </marker>
  </defs>

  <text class="accent" x="30" y="488">No new servers, no new hosted services — everything runs on infrastructure that already exists.</text>
</svg>
