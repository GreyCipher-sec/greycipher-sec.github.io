name: Deploy Zola site to Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          sudo snap install zola --edge

      - name: Fix Theme Structure for CI
        run: |
          rm -rf themes/NOIR
          mkdir -p themes
          git clone https://github.com/GreyCipher-sec/NOIR.git themes/NOIR

      - name: Build Site
        run: |
          zola --config zola.toml build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
